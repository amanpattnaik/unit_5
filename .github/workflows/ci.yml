name: ReactNewApp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReactNewApp
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ReactNewApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm test

      - name: Build React application
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v6
        with:
          name: react-production-build
          path: ReactNewApp/dist/
